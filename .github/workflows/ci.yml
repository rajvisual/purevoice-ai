name: PureVoice CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Verify Audio Engine Syntax & Processing
      run: |
        python -m py_compile backend/denoiser_engine.py server.py
        ffmpeg -f lavfi -i "sine=frequency=440:duration=2" -f lavfi -i "anoisesrc=d=2:c=pink:a=0.1" -filter_complex "[0:a][1:a]amix=inputs=2:duration=first" -y test_in.wav
        python -c "from backend.denoiser_engine import PureVoiceDenoiser; d = PureVoiceDenoiser(); res = d.process_file('test_in.wav', 'outputs', preset='instagram'); assert res['success'], 'Processing failed'"
