<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Waveform Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow1)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow2)" />
  <rect width="1200" height="360" rx="16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Audio Waveform Graphic on Right Side -->
  <g opacity="0.85" filter="url(#glowFilter)">
    <!-- Noise waveform (Red/Orange jagged faded) -->
    <path d="M720,240 Q750,180 780,240 T840,240 T900,240 T960,240 T1020,240 T1080,240" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />
    
    <!-- Clean enhanced vocal wave (Smooth radiant gradient) -->
    <path d="M700,180 C740,110 770,250 810,180 C840,120 870,240 910,180 C950,80 980,280 1020,180 C1060,130 1090,230 1130,180" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Soundbars Graphic -->
  <g transform="translate(730, 140)" opacity="0.9">
    <rect x="0" y="20" width="6" height="40" rx="3" fill="#6366f1" />
    <rect x="14" y="5" width="6" height="70" rx="3" fill="#818cf8" />
    <rect x="28" y="15" width="6" height="50" rx="3" fill="#a855f7" />
    <rect x="42" y="0" width="6" height="80" rx="3" fill="#c084fc" />
    <rect x="56" y="25" width="6" height="30" rx="3" fill="#e879f9" />
    <rect x="70" y="8" width="6" height="64" rx="3" fill="#ec4899" />
    <rect x="84" y="22" width="6" height="36" rx="3" fill="#f43f5e" />
  </g>

  <!-- Left Content: Logo + Typography -->
  <g transform="translate(80, 75)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <circle cx="16" cy="16" r="5" fill="#a855f7" />
    <text x="32" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">STUDIO AUDIO AI</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">PureVoice AI</text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">Studio-Grade Audio &amp; Video Noise Reduction</text>

    <text x="0" y="162" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Transform noisy microphones, street hum, and fan drone into crystal-clear speech.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="128" height="28" rx="14" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.4)" />
      <text x="14" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⚡ Zero Re-Encode</text>

      <rect x="140" y="0" width="145" height="28" rx="14" fill="rgba(168, 85, 247, 0.18)" stroke="rgba(168, 85, 247, 0.4)" />
      <text x="154" y="18" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🎙️ Vocal EQ Presence</text>

      <rect x="297" y="0" width="138" height="28" rx="14" fill="rgba(236, 72, 153, 0.18)" stroke="rgba(236, 72, 153, 0.4)" />
      <text x="311" y="18" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🎧 Live A/B Compare</text>
    </g>
  </g>
</svg>
