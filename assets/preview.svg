<svg width="1000" height="600" viewBox="0 0 1000 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e101f" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="960" height="560" rx="16" fill="url(#bgCanvas)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="20" y="20" width="960" height="560" rx="16" fill="url(#topGlow)" />

  <!-- Browser Navigation Bar -->
  <rect x="20" y="20" width="960" height="42" rx="16" fill="#111320" />
  <rect x="20" y="44" width="960" height="18" fill="#111320" />
  <line x1="20" y1="62" x2="980" y2="62" stroke="rgba(255, 255, 255, 0.08)" />
  <circle cx="44" cy="41" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="62" cy="41" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="80" cy="41" r="5.5" fill="#10b981" opacity="0.85" />
  
  <!-- Address Bar -->
  <rect x="260" y="30" width="480" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="500" y="46" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
    https://purevoice-ai-bdyxyer2hovudzsgb5g2er.streamlit.app
  </text>

  <!-- Hero Header -->
  <g transform="translate(0, 88)">
    <!-- Badge -->
    <rect x="420" y="0" width="160" height="26" rx="13" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" />
    <circle cx="434" cy="13" r="3.5" fill="#a855f7" />
    <text x="504" y="17" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">PUREVOICE STUDIO AI</text>

    <!-- Main Title -->
    <text x="500" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.8" text-anchor="middle">
      Crystal-Clear Audio with <tspan fill="url(#titleGrad)">PureVoice AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="76" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="400" text-anchor="middle">
      Auto-detect background noise and enhance human speech with studio microphone clarity.
    </text>
  </g>

  <!-- Tabs Navigation -->
  <g transform="translate(70, 196)">
    <rect x="0" y="0" width="190" height="34" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.2" />
    <text x="95" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎬 Video Noise Reducer</text>

    <rect x="205" y="0" width="190" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="300" y="21" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎧 Audio Noise Reducer</text>

    <line x1="-10" y1="46" x2="870" y2="46" stroke="rgba(255, 255, 255, 0.08)" />
  </g>

  <!-- Main Content Grid -->
  <!-- Left Column: Upload -->
  <g transform="translate(70, 260)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">1. Upload Video or Audio File</text>

    <!-- Dashed Upload Zone Box -->
    <rect x="0" y="14" width="410" height="185" rx="14" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- Upload Inner Pill -->
    <rect x="20" y="40" width="370" height="52" rx="10" fill="#181a29" stroke="rgba(255, 255, 255, 0.08)" />
    <rect x="32" y="50" width="76" height="32" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="70" y="70" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⬆ Browse</text>
    <text x="120" y="70" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="400">MP4, MOV, MKV, MP3, WAV, AAC</text>

    <!-- File Attached Preview Card -->
    <rect x="20" y="106" width="370" height="74" rx="10" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" />
    <circle cx="44" cy="143" r="14" fill="rgba(99, 102, 241, 0.2)" />
    <text x="44" y="147" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">🎬</text>
    <text x="68" y="138" fill="#f3f4f6" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">podcast_interview_4k.mp4</text>
    <text x="68" y="154" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="10">4K 60FPS • Lossless video remuxing active</text>
    <text x="350" y="145" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">READY</text>
  </g>

  <!-- Right Column: Mode Selector & Smart Auto Details -->
  <g transform="translate(520, 260)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">2. Creator Audio Mode</text>

    <!-- Radio Options -->
    <g transform="translate(0, 16)">
      <!-- Selected Radio: Smart Auto-Detect -->
      <circle cx="10" cy="10" r="7" fill="none" stroke="#a855f7" stroke-width="2" />
      <circle cx="10" cy="10" r="4" fill="#a855f7" />
      <text x="24" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">🤖 Smart Auto-Detect (Zero-Guesswork)</text>

      <!-- Unselected Radio: Manual Sliders -->
      <circle cx="280" cy="10" r="7" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
      <text x="294" y="14" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500">🎛️ Manual Sliders</text>
    </g>

    <!-- Smart Auto Explanation Card -->
    <rect x="0" y="46" width="410" height="60" rx="10" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.28)" />
    <text x="14" y="68" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">💡 Smart Acoustic Auto-Detection Active</text>
    <text x="14" y="86" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="9.5">Scans dynamic range and noise floor to compute ideal dB reduction &amp; voice %.</text>

    <!-- AI Auto-Tuned Badge Result -->
    <rect x="0" y="116" width="410" height="54" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" />
    <circle cx="22" cy="143" r="10" fill="rgba(16, 185, 129, 0.2)" />
    <text x="22" y="147" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">✓</text>
    <text x="40" y="137" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">🎯 AI Auto-Tuned: Moderate Ambient Room Noise</text>
    <text x="40" y="153" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="9.5">Applied 12 dB Noise Suppression • 80% Vocal Presence Polish</text>

    <text x="0" y="190" fill="#6b7280" font-family="-apple-system, sans-serif" font-size="9.5">⚡ Lossless Remuxing: 100% 4K/60FPS video quality preserved without re-encoding.</text>
  </g>

  <!-- Bottom CTA Action Bar -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="860" height="46" rx="12" fill="url(#titleGrad)" />
    <text x="430" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">✨ Clean &amp; Enhance with PureVoice AI</text>
  </g>
</svg>
