<svg width="1000" height="580" viewBox="0 0 1000 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0d0e1b" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="960" height="540" rx="16" fill="url(#bgCanvas)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="20" y="20" width="960" height="540" rx="16" fill="url(#topGlow)" />

  <!-- Browser Navigation Bar -->
  <rect x="20" y="20" width="960" height="42" rx="16" fill="#111320" />
  <rect x="20" y="44" width="960" height="18" fill="#111320" />
  <line x1="20" y1="62" x2="980" y2="62" stroke="rgba(255, 255, 255, 0.08)" />
  <circle cx="44" cy="41" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="62" cy="41" r="5.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="80" cy="41" r="5.5" fill="#10b981" opacity="0.8" />
  
  <!-- Address Bar -->
  <rect x="280" y="30" width="440" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="500" y="46" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
    purevoice-ai-bdyxyer2hovudzsgb5g2er.streamlit.app
  </text>

  <!-- Hero Header -->
  <g transform="translate(0, 90)">
    <!-- Badge -->
    <rect x="420" y="0" width="160" height="26" rx="13" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" />
    <circle cx="434" cy="13" r="3.5" fill="#a855f7" />
    <text x="504" y="17" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">PUREVOICE STUDIO AI</text>

    <!-- Main Title -->
    <text x="500" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.8" text-anchor="middle">
      Crystal-Clear Audio with <tspan fill="url(#titleGrad)">PureVoice AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="76" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="400" text-anchor="middle">
      Wipe out background fans, air conditioning hum, street chatter, and wind rumble with 1-click studio vocal enhancement.
    </text>
  </g>

  <!-- Tabs Navigation -->
  <g transform="translate(70, 205)">
    <!-- Video Tab -->
    <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="80" y="21" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎬 Video Noise Reducer</text>

    <!-- Audio Tab (Active) -->
    <rect x="175" y="0" width="160" height="34" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.2" />
    <text x="255" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎧 Audio Noise Reducer</text>

    <line x1="-10" y1="46" x2="870" y2="46" stroke="rgba(255, 255, 255, 0.08)" />
  </g>

  <!-- Main Content Grid (Two Columns) -->
  <!-- Left Column: Upload -->
  <g transform="translate(70, 275)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">1. Upload Audio File</text>

    <!-- Dashed Upload Zone Box -->
    <rect x="0" y="16" width="450" height="140" rx="14" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- Upload Inner Pill -->
    <rect x="24" y="44" width="402" height="52" rx="10" fill="#181a29" stroke="rgba(255, 255, 255, 0.08)" />
    <!-- Browse button inside -->
    <rect x="36" y="54" width="76" height="32" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="74" y="74" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⬆ Upload</text>
    <text x="130" y="74" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">200MB per file • MP3, WAV, M4A, AAC, FLAC, OGG</text>
  </g>

  <!-- Right Column: Settings -->
  <g transform="translate(560, 275)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">2. Tuning Presets</text>

    <!-- Preset Dropdown Label -->
    <text x="0" y="24" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Vocal Enhancement Preset</text>
    
    <!-- Dropdown Box -->
    <rect x="0" y="32" width="370" height="42" rx="10" fill="#181a29" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="16" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">✨ PureVoice Creator (Vocal Boost + 85Hz Low-Cut)</text>
    <polyline points="340,54 346,60 352,54" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" />

    <!-- Slider Label -->
    <text x="0" y="100" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Noise Suppression Depth (dB)</text>
    <text x="185" y="120" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">18</text>

    <!-- Slider Track -->
    <rect x="0" y="128" width="370" height="4" rx="2" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="0" y="128" width="185" height="4" rx="2" fill="#f43f5e" />
    <circle cx="185" cy="130" r="7" fill="#f43f5e" />
  </g>

  <!-- Bottom CTA Action Bar -->
  <g transform="translate(70, 465)">
    <rect x="0" y="0" width="860" height="46" rx="12" fill="url(#titleGrad)" />
    <text x="430" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">✨ Clean Audio with PureVoice AI</text>
  </g>
</svg>
