<svg width="1000" height="580" viewBox="0 0 1000 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0d0e1b" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="960" height="540" rx="16" fill="url(#bgCanvas)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="20" y="20" width="960" height="540" rx="16" fill="url(#topGlow)" />

  <!-- Browser Navigation Bar -->
  <rect x="20" y="20" width="960" height="42" rx="16" fill="#111320" />
  <rect x="20" y="44" width="960" height="18" fill="#111320" />
  <line x1="20" y1="62" x2="980" y2="62" stroke="rgba(255, 255, 255, 0.08)" />
  <circle cx="44" cy="41" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="62" cy="41" r="5.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="80" cy="41" r="5.5" fill="#10b981" opacity="0.8" />
  
  <!-- Address Bar -->
  <rect x="280" y="30" width="440" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="500" y="46" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
    purevoice-ai-bdyxyer2hovudzsgb5g2er.streamlit.app
  </text>

  <!-- Hero Header -->
  <g transform="translate(0, 90)">
    <!-- Badge -->
    <rect x="420" y="0" width="160" height="26" rx="13" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" />
    <circle cx="434" cy="13" r="3.5" fill="#a855f7" />
    <text x="504" y="17" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">PUREVOICE STUDIO AI</text>

    <!-- Main Title -->
    <text x="500" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.8" text-anchor="middle">
      Crystal-Clear Audio with <tspan fill="url(#titleGrad)">PureVoice AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="76" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="400" text-anchor="middle">
      Reduce background noise and enhance human speech with studio microphone clarity.
    </text>
  </g>

  <!-- Tabs Navigation -->
  <g transform="translate(70, 200)">
    <rect x="0" y="0" width="200" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="100" y="21" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎬 Video Enhancer</text>

    <rect x="215" y="0" width="200" height="34" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.2" />
    <text x="315" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎧 Audio Enhancer</text>

    <line x1="-10" y1="46" x2="870" y2="46" stroke="rgba(255, 255, 255, 0.08)" />
  </g>

  <!-- Main Content Grid -->
  <!-- Left Column: Upload -->
  <g transform="translate(70, 265)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700">1. Upload Audio File</text>

    <!-- Dashed Upload Zone Box -->
    <rect x="0" y="14" width="440" height="150" rx="14" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- Upload Inner Pill -->
    <rect x="20" y="44" width="400" height="52" rx="10" fill="#181a29" stroke="rgba(255, 255, 255, 0.08)" />
    <rect x="32" y="54" width="76" height="32" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="70" y="74" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⬆ Upload</text>
    <text x="120" y="74" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">200MB per file • MP3, WAV, M4A, AAC, FLAC</text>
  </g>

  <!-- Right Column: Dual Controls (Reduce Noise + Enhance Voice) -->
  <g transform="translate(550, 265)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700">2. Creator Audio Controls</text>

    <!-- Control 1: Reduce Noise -->
    <text x="0" y="24" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">🔇 Reduce Noise (12 dB)</text>
    <rect x="0" y="34" width="380" height="4" rx="2" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="0" y="34" width="190" height="4" rx="2" fill="#a855f7" />
    <circle cx="190" cy="36" r="6" fill="#a855f7" />

    <!-- Control 2: Enhance Voice (Instagram Edit Feature!) -->
    <g transform="translate(0, 56)">
      <text x="0" y="16" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">✨ Enhance Voice (Studio Polish)</text>
      <!-- Switch Toggle ON -->
      <rect x="330" y="4" width="46" height="22" rx="11" fill="#a855f7" />
      <circle cx="363" cy="15" r="8" fill="#ffffff" />

      <!-- Voice Intensity Slider -->
      <text x="0" y="44" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="10.5">Vocal Intensity: 80%</text>
      <rect x="0" y="52" width="380" height="4" rx="2" fill="rgba(255, 255, 255, 0.15)" />
      <rect x="0" y="52" width="304" height="4" rx="2" fill="#ec4899" />
      <circle cx="304" cy="54" r="6" fill="#ec4899" />
      <text x="0" y="74" fill="#6b7280" font-family="-apple-system, sans-serif" font-size="9.5">Adds proximity warmth, 3.4kHz clarity, condenser air &amp; speech leveler.</text>
    </g>
  </g>

  <!-- Bottom CTA Action Bar -->
  <g transform="translate(70, 465)">
    <rect x="0" y="0" width="860" height="46" rx="12" fill="url(#titleGrad)" />
    <text x="430" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">✨ Clean &amp; Enhance Audio with PureVoice AI</text>
  </g>
</svg>
